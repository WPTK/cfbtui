version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it. Security updates ignore the cooldown.
    cooldown:
      default-days: 7
  # uv.lock (release and updater e2e builds) is bumped by the uv ecosystem; pip covers the pyproject ranges.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

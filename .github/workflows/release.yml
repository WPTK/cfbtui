name: Release

# Pushing a tag like v1.3.0 builds one
# standalone binary per platform, builds the source tarball and wheel for people who would rather install with pip,
# attests the build provenance of all of them, and publishes one public GitHub release carrying all of it, a SHA256SUMS
# file and that version's CHANGELOG section. The tag must be on main and must match the version in cfbtui/__init__.py.
#
# After the release, the same sdist and wheel are uploaded to PyPI with trusted publishing (the `pypi` environment;
# no token is stored). publish.yml does the same by hand for a ref that has no automatic upload.
#
# Trust: the self-updater checks a download against the SHA256SUMS of the same release, which protects against
# corruption, not against a compromised GitHub account (docs/signing.md). Anyone can check a binary by hand with
# `gh attestation verify`.
#
# The binaries are built by binaries.yml (the file names and runners are listed there), which calls the shared build
# workflow in WPTK/release-workflows. The file-set check and the release itself (SHA256SUMS, the draft, the upload) are
# shared workflows from the same repository too, pinned by commit SHA. Attestation stays in this file, in the `attest`
# job between the shared check and the shared publish: the certificate names the workflow that ran the step, and
# `gh attestation verify --signer-workflow WPTK/cfbtui/.github/workflows/release.yml` expects this one. The `pypi` job
# stays here for the same reason (PyPI matches this file name and the `pypi` environment).
#
# Job order: check, sdist and build (parallel) -> check-release -> attest -> publish -> pypi.
# Seven files ship: the wheel, the tarball and five bare binaries (no archive).
#
# Every job installs the dependencies from uv.lock (`uv sync --locked`, hashes recorded), not from whatever the
# version ranges in pyproject.toml resolve to that day. Not locked: the uv version (pinned, installed with pip) and
# the setuptools build backend, which is fetched at install time.
# Every action is pinned to a full commit SHA; the comment after it is the version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# binaries.yml repeats these two as literals (a called workflow does not inherit env:); change them together.
env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.13.0"

jobs:
  check:
    name: Tag matches the version and the changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tag must be on main and match the package version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
          version="$(python -c 'import cfbtui; print(cfbtui.__version__)')"
          if [ "v$version" != "$TAG" ]; then echo "Tag $TAG does not match cfbtui.__version__ v$version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          grep -q "^## $VERSION " CHANGELOG.md || { echo "No '## $VERSION' section in CHANGELOG.md"; exit 1; }
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if [ ! -s release-notes.md ]; then echo "The '## $VERSION' section of CHANGELOG.md is empty"; exit 1; fi
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  sdist:
    name: Source tarball and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m build --sdist --wheel --outdir dist .
      - name: The wheel installs and runs in a clean environment
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          out="$(/tmp/wheel-check/bin/cfbtui --version)"
          echo "$out"
          [ "$out" = "cfbtui ${TAG#v}" ] || { echo "wheel reports '$out'"; exit 1; }
          /tmp/wheel-check/bin/cfbtui --selftest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-python
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  # The five binaries, built and smoke-tested by binaries.yml (which calls the shared build workflow in
  # WPTK/release-workflows). It also runs on pull requests that touch the build.
  build:
    name: Binaries
    uses: ./.github/workflows/binaries.yml

  # The file set and the tag are checked before anything is attested, so no signed claim is made about a moved tag or a
  # stray file. publish repeats both checks. Seven files ship: the wheel, the tarball and the five binaries.
  check-release:
    name: Check the files and the tag
    needs: [check, sdist, build]
    uses: WPTK/release-workflows/.github/workflows/check-release.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      python-artifact: dist-python
      expected-files: |
        cfbtui-${{ needs.check.outputs.version }}-py3-none-any.whl
        cfbtui-${{ needs.check.outputs.version }}.tar.gz
        cfbtui-windows-x86_64.exe
        cfbtui-linux-x86_64
        cfbtui-linux-arm64
        cfbtui-macos-arm64
        cfbtui-macos-x86_64

  attest:
    name: Attest build provenance
    needs: check-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-python
          path: release
      # Provenance (SLSA build attestation) for the five binaries, the tarball and the wheel. The glob skips SHA256SUMS,
      # which does not exist yet.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/cfbtui-*

  # Calls the shared publish workflow: checks the file set again, writes SHA256SUMS, confirms the tag still points at the
  # built commit, and creates the release (a draft first, published once the files are uploaded).
  publish:
    name: Publish the release
    needs: [check, sdist, build, attest]
    permissions:
      contents: write
    uses: WPTK/release-workflows/.github/workflows/publish-release.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      python-artifact: dist-python
      notes-file: release-notes.md
      title-prefix: "cfbtui "
      expected-files: |
        cfbtui-${{ needs.check.outputs.version }}-py3-none-any.whl
        cfbtui-${{ needs.check.outputs.version }}.tar.gz
        cfbtui-windows-x86_64.exe
        cfbtui-linux-x86_64
        cfbtui-linux-arm64
        cfbtui-macos-arm64
        cfbtui-macos-x86_64

  pypi:
    name: Upload to PyPI
    # After the GitHub release is out, so a failed binary, attestation or release never leaves a PyPI-only version.
    # Uploads the same sdist and wheel the release carries (dist-python), without rebuilding.
    needs: [check, sdist, build, attest, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

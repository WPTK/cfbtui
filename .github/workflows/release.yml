name: Release

# Pushing a tag like v1.0.0 tests the code, builds cfbtui.exe on Windows and publishes a public
# GitHub release carrying the exe, its SHA-256 and that version's CHANGELOG section.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

      - name: Tag must match the package version
        shell: pwsh
        run: |
          $version = python -c "import cfbtui; print(cfbtui.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match cfbtui.__version__ v$version"
          }

      - name: Build the exe
        shell: pwsh
        run: ./scripts/build_exe.ps1

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $out = ./dist/cfbtui.exe --version
          Write-Host $out
          if ($out -notmatch [regex]::Escape("${{ github.ref_name }}".TrimStart("v"))) { throw "exe reports '$out'" }
          ./dist/cfbtui.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }

      - name: Extract this version's changelog section
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($version)) " | Select-Object -First 1).LineNumber
          if (-not $start) { throw "No '## $version' section in CHANGELOG.md" }
          $body = @()
          foreach ($line in $lines[$start..($lines.Count - 1)]) {
            if ($line -match "^## ") { break }
            $body += $line
          }
          ($body -join "`n").Trim() | Set-Content -Encoding utf8 release-notes.md

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" dist/cfbtui.exe dist/cfbtui.exe.sha256 --clobber
            gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
          } else {
            gh release create "${{ github.ref_name }}" dist/cfbtui.exe dist/cfbtui.exe.sha256 `
              --title "cfbtui ${{ github.ref_name }}" `
              --notes-file release-notes.md
          }

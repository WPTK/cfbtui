name: Release

# Pushing a tag like v1.3.0 tests the code on Windows, Linux and macOS, runs the updater end-to-end test, builds one
# standalone binary per platform, builds the source tarball and wheel for people who would rather install with pip,
# attests the build provenance of all of them, and creates a DRAFT GitHub release carrying all of it, a SHA256SUMS
# file and that version's CHANGELOG section. The tag must be on main and must match the version in cfbtui/__init__.py.
#
# The workflow stops at the draft on purpose: the owner signs SHA256SUMS offline (SHA256SUMS.sig), uploads the
# signature and publishes by hand, because the updater refuses any release whose manifest is not signed by a key that
# lives outside GitHub. See docs/release-signing.md. The job summary of the last job lists the steps.
#
# Binaries:
#   cfbtui-windows-x86_64.exe   windows-latest (unsigned; see docs/signing.md)
#   cfbtui-linux-x86_64         ubuntu-latest, built inside python:3.13-bullseye so the glibc floor is 2.31
#                               (Ubuntu 20.04, Debian 11, RHEL 9 and newer)
#   cfbtui-linux-arm64          ubuntu-24.04-arm, same container (Raspberry Pi OS 64-bit, Linux VMs on Apple silicon)
#   cfbtui-macos-arm64          macos-latest (Apple silicon)
#   cfbtui-macos-x86_64         macos-15-intel (GitHub's last Intel image; it goes away in fall 2027, see
#                               https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/)
#
# Every job installs the dependencies from uv.lock (`uv sync --locked`, hashes recorded), not from whatever the
# version ranges in pyproject.toml resolve to that day. Not locked: the uv version (pinned, installed with pip) and
# the setuptools build backend, which is fetched at install time.
# Every action is pinned to a full commit SHA; the comment after it is the version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.13.0"

jobs:
  check:
    name: Tag matches the version and the changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tag must be on main and match the package version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
          version="$(python -c 'import cfbtui; print(cfbtui.__version__)')"
          if [ "v$version" != "$TAG" ]; then echo "Tag $TAG does not match cfbtui.__version__ v$version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A build with placeholder keys would trust no manifest, so its self-updater could never update anyone.
      - name: Release signing keys are filled in
        run: |
          python -c "
          from cfbtui.sigverify import PUBLIC_KEYS, decode_keys
          good = len(decode_keys())
          assert good == len(set(decode_keys())) == len(PUBLIC_KEYS) == 2, f'cfbtui/sigverify.py has {good} usable release keys; it needs two distinct ones, the signing key and the spare (docs/release-signing.md)'
          "

      - name: Extract this version's changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          grep -q "^## $VERSION " CHANGELOG.md || { echo "No '## $VERSION' section in CHANGELOG.md"; exit 1; }
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if [ ! -s release-notes.md ]; then echo "The '## $VERSION' section of CHANGELOG.md is empty"; exit 1; fi
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "uv==$UV_VERSION"
        shell: bash
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m pytest

  updater-e2e:
    name: Updater end-to-end
    # The same workflow you can run by hand; called here it runs on the tagged commit.
    uses: ./.github/workflows/updater-e2e.yml

  sdist:
    name: Source tarball and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m build --sdist --wheel --outdir dist .
      - name: The wheel installs and runs in a clean environment
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          out="$(/tmp/wheel-check/bin/cfbtui --version)"
          echo "$out"
          [ "$out" = "cfbtui ${TAG#v}" ] || { echo "wheel reports '$out'"; exit 1; }
          /tmp/wheel-check/bin/cfbtui --selftest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-python
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  binary:
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Empty for the jobs that run straight on the runner; GitHub treats '' as "no container".
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            ext: .exe
          - name: linux-x86_64
            os: ubuntu-latest
            container: python:3.13-bullseye
          - name: linux-arm64
            os: ubuntu-24.04-arm
            container: python:3.13-bullseye
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
    env:
      BINARY: cfbtui-${{ matrix.name }}${{ matrix.ext }}
      BUILT: dist/cfbtui${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.container == ''
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The "binary" extra is tzdata: it is a Windows-only dependency of the package because other systems ship
      # zone files, but a standalone binary may land on a minimal system that does not, so every binary bundles its own.
      - name: Install (locked)
        shell: bash
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --extra dev --extra binary

      - name: Windows version resource
        if: runner.os == 'Windows'
        shell: bash
        run: uv run --no-sync python scripts/version_info.py

      - name: Build (unsigned; no secrets in this step)
        shell: bash
        run: uv run --no-sync python -m PyInstaller --noconfirm --clean --workpath .pyi-build cfbtui.spec

      - name: Smoke-test the binary
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -la "$BUILT"
          out="$("./$BUILT" --version)"
          echo "$out"
          [ "$out" = "cfbtui ${TAG#v}" ] || { echo "binary reports '$out'"; exit 1; }
          "./$BUILT" --help > /dev/null || { echo "--help failed"; exit 1; }
          "./$BUILT" --selftest || { echo "--selftest failed: the frozen app is missing something"; exit 1; }

      - name: Name the binary for its platform
        shell: bash
        run: mv "$BUILT" "dist/$BINARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.name }}
          path: dist/${{ env.BINARY }}
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: [check, test, updater-e2e, sdist, binary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-python
          path: release
      # Provenance (SLSA build attestation) for the five binaries, the tarball and the wheel. The glob skips SHA256SUMS,
      # which does not exist yet and is covered by the offline signature instead.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/cfbtui-*

  release:
    name: Create the draft release
    needs: [check, test, updater-e2e, sdist, binary, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-python
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Hash everything that will ship
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists. Delete it and re-run if it should be rebuilt."; exit 1
          fi
          gh release create "$TAG" --draft --title "cfbtui $TAG" --notes-file notes/release-notes.md
          gh release upload "$TAG" release/* || { echo "upload failed; the draft release is left in place"; exit 1; }
          # No --draft=false: the owner signs SHA256SUMS and publishes by hand.

      - name: What to do next
        run: |
          {
            echo "## $TAG is a draft: sign it, then publish"
            echo
            echo "The updater refuses a release without \`SHA256SUMS.sig\`, so nothing reaches users until you do this"
            echo "(details and key handling: \`docs/release-signing.md\`):"
            echo
            echo '```sh'
            echo 'dir="$(mktemp -d)"   # an empty folder outside any checkout'
            echo "gh release download $TAG -R $GH_REPO -D \"\$dir\""
            echo "for f in \"\$dir\"/cfbtui-*; do gh attestation verify \"\$f\" -R $GH_REPO \\"
            echo "  --signer-workflow $GH_REPO/.github/workflows/release.yml --source-ref refs/tags/$TAG || exit 1; done"
            echo "python scripts/sign_sums.py sign /path/to/offline/signing.key \"\$dir/SHA256SUMS\"   # also re-hashes every file"
            echo "gh release upload $TAG \"\$dir/SHA256SUMS.sig\" -R $GH_REPO"
            echo "gh release edit $TAG -R $GH_REPO --draft=false"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

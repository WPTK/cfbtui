name: Updater end-to-end

# Run by hand (Actions > Updater end-to-end > Run workflow), and by release.yml on every tag as a gate: a release is
# not created unless this passes on the tagged commit. Builds the real PyInstaller binary at the current version (X)
# and at the next patch version (X+1, bumped in the job's checkout only and never committed), with a throwaway
# signing key trusted in that scratch checkout only. It serves X+1 and a signed SHA256SUMS from a throwaway server on
# 127.0.0.1 inside the job, and checks that the X binary updates itself: install on exit, a second run, a wrong
# checksum, a forged or wrongly signed manifest and a missing signature that each change nothing, and "Restart now".
# It never reads or writes a real release and never touches the real signing keys; see scripts/updater_e2e.py and
# docs/development.md.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  updater:
    name: Updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install (locked)
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --extra dev --extra binary

      - name: Trust a throwaway signing key in this checkout (not committed)
        run: uv run --no-sync python scripts/updater_e2e.py embed-key "$RUNNER_TEMP/e2e-signing.key"

      - name: Build the binary at the current version (X)
        run: |
          OLD="$(uv run --no-sync python -c 'import cfbtui; print(cfbtui.__version__)')"
          echo "OLD=$OLD" >> "$GITHUB_ENV"
          uv run --no-sync python scripts/version_info.py
          uv run --no-sync python -m PyInstaller --noconfirm --clean --workpath "$RUNNER_TEMP/build-old" --distpath "$RUNNER_TEMP/old" cfbtui.spec
          ls "$RUNNER_TEMP/old"

      - name: Build the binary at the next patch version (X+1, not committed)
        run: |
          uv run --no-sync python -m cfbtui.version bump patch --write
          NEW="$(uv run --no-sync python -c 'import cfbtui; print(cfbtui.__version__)')"
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          uv run --no-sync python scripts/version_info.py
          uv run --no-sync python -m PyInstaller --noconfirm --clean --workpath "$RUNNER_TEMP/build-new" --distpath "$RUNNER_TEMP/new" cfbtui.spec
          ls "$RUNNER_TEMP/new"

      - name: Run the updater against the local server
        run: |
          EXT=""
          [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          uv run --no-sync python scripts/updater_e2e.py "$RUNNER_TEMP/old/cfbtui$EXT" "$RUNNER_TEMP/new/cfbtui$EXT" "$OLD" "$NEW" "$RUNNER_TEMP/e2e" "$RUNNER_TEMP/e2e-signing.key"

name: Updater end-to-end

# Run by hand (Actions > Updater end-to-end > Run workflow). Builds the real PyInstaller binary at the current
# version (X) and at the next patch version (X+1, bumped in the job's checkout only and never committed), serves
# X+1 and a SHA256SUMS from a throwaway server on 127.0.0.1 inside the job, and checks that the X binary
# updates itself: install on exit, a second run, a wrong checksum that changes nothing, and "Restart now".
# It never reads or writes a real release; see scripts/updater_e2e.py and docs/development.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater:
    name: Updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" tzdata

      - name: Build the binary at the current version (X)
        run: |
          OLD="$(python -c 'import cfbtui; print(cfbtui.__version__)')"
          echo "OLD=$OLD" >> "$GITHUB_ENV"
          python scripts/version_info.py
          python -m PyInstaller --noconfirm --clean --workpath "$RUNNER_TEMP/build-old" --distpath "$RUNNER_TEMP/old" cfbtui.spec
          ls "$RUNNER_TEMP/old"

      - name: Build the binary at the next patch version (X+1, not committed)
        run: |
          python -m cfbtui.version bump patch --write
          NEW="$(python -c 'import cfbtui; print(cfbtui.__version__)')"
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          python scripts/version_info.py
          python -m PyInstaller --noconfirm --clean --workpath "$RUNNER_TEMP/build-new" --distpath "$RUNNER_TEMP/new" cfbtui.spec
          ls "$RUNNER_TEMP/new"

      - name: Run the updater against the local server
        run: |
          EXT=""
          [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          python scripts/updater_e2e.py "$RUNNER_TEMP/old/cfbtui$EXT" "$RUNNER_TEMP/new/cfbtui$EXT" "$OLD" "$NEW" "$RUNNER_TEMP/e2e"

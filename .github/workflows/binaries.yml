name: Binaries

# Builds the one-file binary on each platform with PyInstaller and smoke-tests it, by calling the shared build workflow
# (WPTK/release-workflows). Called by release.yml on a tag; also runs by hand (workflow_dispatch) and on pull requests
# that touch the build, so a broken spec shows up before a release rather than during one. Nothing here publishes
# anything and it has no secrets.
#
# The files are bare binaries (no archive), named:
#   cfbtui-windows-x86_64.exe   windows-latest (unsigned; see docs/signing.md)
#   cfbtui-linux-x86_64         ubuntu-latest, built inside python:3.13-bullseye so the glibc floor is 2.31
#                               (Ubuntu 20.04, Debian 11, RHEL 9 and newer); the shared workflow checks the floor
#   cfbtui-linux-arm64          ubuntu-24.04-arm, same container (Raspberry Pi OS 64-bit, Linux VMs on Apple silicon)
#   cfbtui-macos-arm64          macos-latest (Apple silicon)
#   cfbtui-macos-x86_64         macos-15-intel (GitHub's last Intel image; it goes away in fall 2027, see
#                               https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/)
#
# Dependencies install from uv.lock (`uv sync --locked`, hashes recorded). The shared workflow does not see this file's
# env:, so the Python and uv versions are literals below; keep them equal to PYTHON_VERSION and UV_VERSION in release.yml.
# The "binary" extra is tzdata: it is a Windows-only dependency of the package because other systems ship zone files,
# but a standalone binary may land on a minimal system that does not, so every binary bundles its own.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - cfbtui/**
      - cfbtui.spec
      - scripts/version_info.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/binaries.yml

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binary:
    name: Binary
    uses: WPTK/release-workflows/.github/workflows/build-binaries.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      app: cfbtui
      asset-prefix: cfbtui
      unix-archive: false
      python-version: "3.13"
      # python:3.13-bullseye, pinned by digest (multi-arch index, checked 2026-11-08). Bullseye is past Debian's LTS
      # window, kept on purpose for the glibc 2.31 floor; move the pin deliberately.
      linux-container: python:3.13-bullseye@sha256:f58f33e0563f2ba81c7afe6259cd912f0c33413da93c75cc3a70a941c17afa8c
      install-command: |
        python -m pip install "uv==0.13.0"
        uv sync --locked --extra dev --extra binary
      # The Windows version resource is written before PyInstaller reads it.
      build-command: |
        if [ "$RUNNER_OS" = Windows ]; then uv run --no-sync python scripts/version_info.py; fi
        uv run --no-sync python -m PyInstaller --noconfirm --clean --workpath .pyi-build cfbtui.spec
      # On a tag run the binary must report the tag's version; elsewhere it must report cfbtui.__version__.
      smoke-command: |
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          want="${GITHUB_REF_NAME#v}"
        else
          want="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' cfbtui/__init__.py)"
        fi
        out="$("$BIN" --version | tr -d '\r')"
        echo "$out"
        [ "$out" = "cfbtui $want" ] || { echo "binary reports '$out'"; exit 1; }
        "$BIN" --help > /dev/null || { echo "--help failed"; exit 1; }
        "$BIN" --selftest || { echo "--selftest failed: the frozen app is missing something"; exit 1; }

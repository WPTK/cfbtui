[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cfbtui"
dynamic = ["version"]
description = "College football scoreboard for your terminal. Live scores, rankings and scoring plays."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Bill Kane" }]
keywords = ["college football", "scoreboard", "tui", "terminal", "textual", "espn"]

dependencies = [
    "textual>=8.2,<9",
    "httpx>=0.28,<1",
    "platformdirs>=4,<5",
    "tomli-w>=1,<2",
    "pyperclip>=1.9,<2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/WPTK/cfbtui"
Issues = "https://github.com/WPTK/cfbtui/issues"
Changelog = "https://github.com/WPTK/cfbtui/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.22,<7",
    "build>=1,<2",
]
# Installed only when building a standalone binary, so every binary carries its own zone files (see release.yml).
binary = ["tzdata>=2024.1"]

[project.scripts]
cfbtui = "cfbtui.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "cfbtui.__version__" }

[tool.setuptools.packages.find]
include = ["cfbtui*"]

[tool.setuptools.package-data]
cfbtui = ["ui/*.tcss"]

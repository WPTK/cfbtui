[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cfbtui"
dynamic = ["version"]
description = "A colorful college football scoreboard for the terminal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Bill Kane" }]
dependencies = [
    "textual>=8.2,<9",
    "httpx>=0.28,<1",
    "platformdirs>=4,<5",
    "tomli-w>=1,<2",
    "pyperclip>=1.9,<2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "pytest-textual-snapshot>=1.1",
    "pronouncing>=0.2",
    "pyinstaller>=6.22,<7",
    "ruff>=0.8",
    "vulture>=2.14",
]

[project.scripts]
cfbtui = "cfbtui.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "cfbtui.__version__" }

[tool.setuptools.packages.find]
include = ["cfbtui*"]

[tool.setuptools.package-data]
cfbtui = ["ui/*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # Textual widgets declare BINDINGS/DEFAULT_CSS as plain class attributes by convention.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Long lines in tests are inline fixture payloads and poem text; wrapping them hurts readability.
# The hook's stop-word list and the PyInstaller version template are likewise literal data.
"tests/**" = ["E501"]
".githooks/poem.py" = ["E501"]
"scripts/version_info.py" = ["E501"]

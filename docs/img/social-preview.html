<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #0f141b; }
  body { position: relative; font-family: "Segoe UI", system-ui, sans-serif; color: #e8edf3; }
  .win { position: absolute; left: 600px; top: 150px; width: 1500px; height: 700px; border-radius: 8px 0 0 0;
         overflow: hidden; background: #0c0c0c; box-shadow: 0 20px 60px rgba(0,0,0,.6); border: 1px solid #2a3442; }
  .title { height: 26px; background: #202020; position: relative; }
  .body { overflow: hidden; height: 660px; }
  .shot { display: block; width: 1500px; margin-top: -38px; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0f141b 0 34%, rgba(15,20,27,0) 62%); }
  .text { position: absolute; left: 72px; top: 170px; width: 520px; }
  h1 { margin: 0; font: 700 120px/1 Consolas, "Cascadia Mono", monospace; letter-spacing: -2px; }
  h1 span { color: #f5c542; }
  p { margin: 28px 0 0; font-size: 32px; line-height: 1.3; color: #b8c4d2; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, #f5c542, #e5484d); }
</style>
<div class="win">
  <div class="title"></div>
  <div class="body"><img class="shot" src="grid-unicode.svg"></div>
</div>
<div class="fade"></div>
<div class="text">
  <h1>cfb<span>tui</span></h1>
  <p>Live college football scores<br>in your terminal.</p>
</div>
<div class="bar"></div>
